spring:
  datasource:
    url: jdbc:mysql://${SPRING_DATASOURCE_HOST:10.0.1.242}:${SPRING_DATASOURCE_PORT:3306}/hcdevkit?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8mb4
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

  redis:
    host: ${SPRING_REDIS_HOST:10.0.1.53}
    port: ${SPRING_REDIS_PORT:6379}
    password: ${SPRING_REDIS_PASSWORD:}
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
    timeout: 3000ms
