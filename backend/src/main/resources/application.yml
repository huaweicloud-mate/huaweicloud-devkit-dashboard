server:
  port: 3000

spring:
  application:
    name: hc-devkit-portal
  profiles:
    active: h2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

app:
  cors:
    origins: https://devkit.topxtopx.com,http://localhost:5173
  sync:
    github-token: ${GITHUB_TOKEN:}
    ingest-token: ${INGEST_TOKEN:hcdevkit-portal-ingest-token-v1}
